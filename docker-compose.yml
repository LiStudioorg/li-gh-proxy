services:
  li-gh-proxy:
    image: ghcr.io/listudioorg/li-gh-proxy:latest
    container_name: li-gh-proxy
    restart: always
    ports:
      - "5000:5000"
    volumes:
      # 首次部署：cp src/config.toml ./config.toml 后按需修改
      - ./config.toml:/app/config.toml:ro
    logging:
      driver: json-file
      options:
        max-size: "200m"
        max-file: "3"
