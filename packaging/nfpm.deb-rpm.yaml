name: li-gh-proxy
arch: ${NFPM_ARCH}
platform: linux
version: ${NFPM_VERSION}
release: "1"
section: net
priority: optional
maintainer: LiStudioorg
description: Docker and GitHub acceleration proxy server
vendor: LiStudioorg
homepage: https://github.com/LiStudioorg/li-gh-proxy
license: MIT

contents:
  - src: ./build/package-root/li-gh-proxy
    dst: /usr/bin/li-gh-proxy
    file_info:
      mode: 0755

  - src: ./src/config.toml
    dst: /etc/li-gh-proxy/config.toml
    type: config|noreplace
    file_info:
      mode: 0644

  - src: ./packaging/li-gh-proxy.service
    dst: /lib/systemd/system/li-gh-proxy.service
    file_info:
      mode: 0644

scripts:
  postinstall: ./packaging/postinstall.sh
  preremove: ./packaging/preremove.sh
  postremove: ./packaging/postremove.sh
